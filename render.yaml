services:
  - type: web
    name: sacred-choices-backend
    env: python
    rootDir: sacred-choices-backend
    buildCommand: pip install -r requirements.txt
    startCommand: cd sacred-choices-backend && gunicorn --chdir . wsgi:application --bind=0.0.0.0:$PORT --workers=2 --threads=4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Will be set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # Will be set manually in Render dashboard to your Vercel frontend URL
      - key: PYTHONPATH
        value: /opt/render/project/src/sacred-choices-backend
    healthCheckPath: /api/weeks
    autoDeploy: true 