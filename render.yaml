services:
  - type: web
    name: sacred-choices-backend
    env: python
    rootDir: sacred-choices-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Will be set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # Will be set manually in Render dashboard to your Vercel frontend URL
      - key: PYTHONPATH
        value: .
    autoDeploy: true 